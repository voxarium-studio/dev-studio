<!doctype html>
<!-- The theme store re-stamps the mode from config.yaml; dark is the default, here so the
     first paint does not snap into it (§7). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- The UI typeface, Allo, is bundled from `allo-font` (main.ts) and has no Cyrillic.
         Inter is its Cyrillic fallback in `--vxs-font-sans`: Google serves it split by
         unicode-range, so only the Cyrillic file is fetched, and only when Russian is on
         screen. `display=swap` so an offline load falls back to the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <title>Voxarium Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

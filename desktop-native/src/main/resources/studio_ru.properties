nativeTeam.prompts.fragment.no_studio_tools=Без инструментов Studio
nativeTeam.prompts.hint.no_studio_tools=Отправляется вместо строки о навыке Studio, если у участника есть маршруты, но инструменты Studio выключены или недоступны.
nativeTeam.prompts.fragment.member_skills=Навыки
nativeTeam.prompts.hint.member_skills=Отправляется, если участнику выданы навыки на странице «Команды», — и при запуске задач, и в чатах. {skills} — по строке на навык: имя, описание и путь к его SKILL.md.
nativeTeam.prompts.fragment.docs_location=Папка документов
nativeTeam.prompts.hint.docs_location=Где на диске лежат общие документы команды.
nativeTeam.prompts.fragment.project_memory=Память проекта
nativeTeam.prompts.hint.project_memory=Отправляется запускам задач и беседам, пока память проекта включена и инструменты Студии доступны сессии, — даже пустая: она просит агентов записывать то, что они узнали. {entries} — индекс: по строке на запись, имя и описание, обрезанный по пределу со страницы «Память».
nativeTeam.prompts.fragment.subagents=Субагенты
nativeTeam.prompts.hint.subagents=Отправляется запускам задач, которым доступны инструменты Студии; у бесед нет задачи, которую можно делить, и они его не получают. Требует разбить задачу на параллельные части и раздать их через инструменты субагентов Студии, а если задача так не делится — не создавать субагентов.
nativeTeam.prompts.fragment.code_graph=Граф кода
nativeTeam.prompts.hint.code_graph=Отправляется, если в корне запуска агентов есть граф знаний graphify — плагин Graphify поддерживает его там. Называет граф и отсылает сессию к навыку Studio, где описано, как делать к нему запросы; {graph} — файл, {skill} — навык.
nativeTeam.prompts.fragment.isolated_checkout=Изолированная рабочая копия
nativeTeam.prompts.hint.isolated_checkout=Отправляется, если задача выполняется в собственном worktree, ответвлённом от проекта (§10.5).
nativeTeam.prompts.fragment.outside_project=За пределами проекта
nativeTeam.prompts.hint.outside_project=Отправляется, если корень запуска выводит сессию за пределы корня проекта.
nativeTeam.prompts.fragment.finish=Завершение
nativeTeam.prompts.hint.finish=Завершает системный промпт: просит написать итог для проверяющего.
nativeTeam.prompts.fragment.finish_tool=Завершение, с инструментами
nativeTeam.prompts.hint.finish_tool=Закрывает системный промпт, когда инструменты Студии доступны сессии: просит вызвать finish_task с типом итога — done, question или error — и сводкой.
nativeTeam.prompts.fragment.resume=Возобновление
nativeTeam.prompts.hint.resume=Открывает возобновлённую сессию, если для неё ничего нового не написано, — описание уже есть в её контексте.
nativeTeam.prompts.fragment.resume_notes=Вступление к заметкам
nativeTeam.prompts.hint.resume_notes=Предваряет заметки, написанные после остановки последнего запуска, — сразу после сообщения «Возобновление».
nativeTeam.prompts.fragment.review_changes=Запрошены правки
nativeTeam.prompts.hint.review_changes=Открывает сессию, которую проверяющий вернул на доработку; {comment} — отзыв проверяющего.
nativeTeam.prompts.fragment.stall_continue=Продолжение после остановки
nativeTeam.prompts.hint.stall_continue=Открывает каждое автоматическое продолжение сессии, которая остановилась посреди работы, исчерпав лимит ходов.
nativeTeam.prompts.fragment.mid_run_message=Сообщение работающей сессии
nativeTeam.prompts.hint.mid_run_message=Обрамляет то, что вы отправляете в задачу или чат, пока агент работает: передаётся между двумя вызовами инструментов либо следующим ходом. {message} — ваш текст.
nativeTeam.prompts.fragment.result_required=Итог не указан
nativeTeam.prompts.hint.result_required=Отправляется один раз сессии, закончившейся без вызова finish_task; сессия, которая и после этого молчит, попадает на проверку без пометки.
nativeTeam.prompts.fragment.chat_mode=Режим чата
nativeTeam.prompts.hint.chat_mode=Стоит в системном промпте чата на месте ID задачи: это разговор с пользователем, а не карточка на доске.
nativeTeam.prompts.fragment.chat_context=Где находится пользователь
nativeTeam.prompts.hint.chat_context=Открывает каждое сообщение в чате; {context} — страница, открытый документ и выделенный текст на момент отправки.
nativeTeam.prompts.fragment.producer_mode=Системный промпт продюсера
nativeTeam.prompts.hint.producer_mode=Задаёт зону ответственности встроенного продюсера и правила планирования, одобрения, проверки границ задачи и ожидания в режиме продюсера. {language} — начальный язык беседы.
nativeTeam.prompts.fragment.producer_start=Запуск продюсера
nativeTeam.prompts.hint.producer_start=Продюсер спрашивает, что пользователь хочет сделать сейчас.
nativeTeam.prompts.fragment.producer_wake=Продолжение работы продюсера
nativeTeam.prompts.hint.producer_wake=Возобновляет координацию после одобрения, изменений задач или перезапуска.
nativeTeam.prompts.fragment.task_compact=Сжатие контекста задачи
nativeTeam.prompts.hint.task_compact=Сохраняет решения, выполненную работу и ожидающие запросы в одной сводке для новой сессии.
nativeTeam.prompts.fragment.producer_compact=Сжатие контекста продюсера
nativeTeam.prompts.hint.producer_compact=Сохраняет цели, решения и ход задач для продолжения в новом контексте.
nativeTeam.prompts.fragment.producer_careful=Продюсер: Careful
nativeTeam.prompts.hint.producer_careful=Передаёт новые рабочие вопросы пользователю и ждёт одобрения плана.
nativeTeam.prompts.fragment.producer_independent=Продюсер: Independent
nativeTeam.prompts.hint.producer_independent=Сам принимает решения и одобряет планы; передаёт пользователю только критические препятствия.
nativeTeam.prompts.fragment.producer_task_cost=Проверка стоимости задачи
nativeTeam.prompts.hint.producer_task_cost=Объясняет продюсеру, как сравнивать накопленную API Cost с Estimate Task Cost перед продолжением задачи и когда переносить оставшуюся работу в новые задачи.
nativeTeam.prompts.fragment.producer_review=Правила ревью задач
nativeTeam.prompts.hint.producer_review=Определяет решения при ревью и объясняет, как закрывать выполненную работу и создавать новые задачи для исправлений.
nativeTeam.prompts.fragment.producer_state=Текущее состояние и история задач
nativeTeam.prompts.hint.producer_state=Добавляет текущее состояние продюсера и инструкции по чтению истории задач. {state} — сохранённое состояние и доска задач; {prompt} — текущий запрос.
nativeTeam.prompts.fragment.producer_summary=Сохранённая сводка беседы
nativeTeam.prompts.hint.producer_summary=Восстанавливает сохранённую сводку перед новым запросом. {summary} — сжатая беседа; {prompt} — текущий запрос.
nativeTeam.prompts.removed=удалено
nativeTeam.prompts.edited=изменено
nativeTeam.prompts.reset=Вернуть исходный текст
nativeTeam.prompts.required=Для пустой строки используется встроенный текст.
nativeTeam.prompts.optional=Очистите строку, чтобы убрать её из промпта.


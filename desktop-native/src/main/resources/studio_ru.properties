stats.activity.title=Активность
stats.activity.hint=Каждая клетка показывает день. Чем больше завершилось запусков агентов и задач, тем насыщеннее цвет. Недели идут слева направо до сегодняшнего дня. Наведите указатель на клетку для подробностей.
stats.activity.noActivity=Нет активности
stats.activity.less=Меньше
stats.activity.more=Больше
stats.chart.title=Стоимость проекта во времени
stats.chart.hint=Нарастающий итог стоимости запусков агентов по дням UTC. Точки отмечают дни с расходами. После последней точки итог остаётся постоянным до сегодняшнего дня.
stats.chart.empty=Пока ничего не потрачено — кривая начнётся с первого запуска агента.
stats.tokensChart.title=Расход токенов во времени
stats.tokensChart.hint=Нарастающий итог для выбранного типа токенов. Точки отмечают дни с зарегистрированным расходом. После последней точки итог остаётся постоянным до сегодняшнего дня.
stats.tokensChart.empty=Расход токенов пока не записан.
stats.averageChart.costTitle=Средняя стоимость задачи
stats.averageChart.costHint=Средняя полная стоимость API задач в «Готово» по дню завершения (UTC). Учитываются архивные и бесплатные задачи.
stats.averageChart.tokensTitle=Средний расход токенов на задачу
stats.averageChart.tokensHint=Средний полный расход выбранного типа токенов у задач в «Готово» по дню завершения (UTC). Учитываются архивные задачи и задачи с нулевым расходом.
stats.averageChart.empty=Пока нет готовых задач с датой завершения.
stats.durationChart.title=Среднее время выполнения задачи
stats.durationChart.hint=Среднее время выполнения завершённых задач с данными о длительности, включая архивные. Используется сумма длительностей запусков или интервал от старта до завершения. Дни считаются по UTC.
stats.durationChart.empty=Пока нет завершённых задач с данными о времени выполнения.

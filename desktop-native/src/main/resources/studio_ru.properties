stats.token.cachedShort=Чтение кэша
stats.token.cachedHint=Входные токены, прочитанные из кэша. Они не входят в расход без чтения кэша.
stats.token.unclassifiedShort=Не классифицировано
stats.token.unclassifiedHint=Исторические токены, для которых недостаточно данных, чтобы выделить чтение кэша. Они не считаются токенами без кэша.

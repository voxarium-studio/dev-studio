graphify.intro=Граф знаний по коду и документам: код разбирается локально по AST — без модели и ключа, документы читаются через выбранный агентский CLI — Claude Code, Codex или Qwen Code. Искать по графу можно из боковой панели (Ctrl+K); агентам предписано обращаться к нему, прежде чем искать через grep, — формулировка в разделе Настройки → Промпты агентов → Граф кода.
graphify.reset.body=Это полностью удалит {dir} — граф кода, граф документов, объединённый граф, манифесты и все кэши — и проиндексирует всё с нуля. Каждый документ снова будет прочитан через выбранный агентский CLI — это займёт время и израсходует квоту вашей подписки. «Индексировать» и «Перестроить всё» сохраняют кэши — пользуйтесь ими, если только граф не испорчен так, что они этого не исправят.
graphify.reset.bodyRunning=Это полностью удалит {dir} — граф кода, граф документов, объединённый граф, манифесты и все кэши — и проиндексирует всё с нуля. Каждый документ снова будет прочитан через выбранный агентский CLI — это займёт время и израсходует квоту вашей подписки. Идущая сейчас индексация сначала будет остановлена. «Индексировать» и «Перестроить всё» сохраняют кэши — пользуйтесь ими, если только граф не испорчен так, что они этого не исправят.
graphify.reset.confirm=Да, удалить всё и начать заново
graphify.reset.title=Сбросить весь индекс?

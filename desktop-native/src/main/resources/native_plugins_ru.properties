hunyuan3d.environment.blurb=Узлы генерации выполняются в отдельном процессе, в собственном venv плагина. Studio собирает его сама — при включении плагина и заново после изменения requirements.txt, — а узел, которому оно нужно, дожидается сборки. Если сборка не удалась, узлы используют интерпретатор Studio: это работает, но без numpy. Серверному режиму Hunyuan3D здесь больше ничего не нужно; для локального добавьте torch и пакеты модели в requirements.txt — см. README плагина.

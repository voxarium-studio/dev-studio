graphify.intro=A knowledge graph of the code and the documents: the code from the local AST with no model or key, the documents read through the agent CLI you choose — Claude Code, Codex or Qwen Code. Search it from the rail (Ctrl+K); agents are told to query it before grepping — the wording is under Settings → Agent prompts → Code graph.
graphify.reset.body=This removes {dir} entirely — the code graph, the documents graph, the merged graph, the manifests and every cache — and indexes everything again from scratch. Every document is read through the chosen agent CLI again, which costs time and your subscription’s quota. Index now and Rebuild all keep the caches; use those unless the graph is wrong in a way they do not fix.
graphify.reset.bodyRunning=This removes {dir} entirely — the code graph, the documents graph, the merged graph, the manifests and every cache — and indexes everything again from scratch. Every document is read through the chosen agent CLI again, which costs time and your subscription’s quota. The indexing running now is stopped first. Index now and Rebuild all keep the caches; use those unless the graph is wrong in a way they do not fix.
graphify.reset.confirm=Yes, remove it all and start over
graphify.reset.title=Reset the whole index?

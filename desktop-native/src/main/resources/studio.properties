nativeTeam.prompts.fragment.identity=Introduction
nativeTeam.prompts.hint.identity=The line that introduces every member: their name, role and team.
nativeTeam.prompts.fragment.identity_responsibility=Responsibility
nativeTeam.prompts.hint.identity_responsibility=Sent when the member has an area of responsibility in the roster.
nativeTeam.prompts.fragment.identity_manager=Manager
nativeTeam.prompts.hint.identity_manager=Sent when the member reports to someone — names who reviews their work.
nativeTeam.prompts.fragment.identity_reports=Direct reports
nativeTeam.prompts.hint.identity_reports=Sent when anyone reports to this member.
nativeTeam.prompts.fragment.identity_peers=Sideways routes
nativeTeam.prompts.hint.identity_peers=Sent when the member may hand work to peers (their can_assign_to list).
nativeTeam.prompts.fragment.task_context=Task id
nativeTeam.prompts.hint.task_context=Tells the session which card it is working on.
nativeTeam.prompts.fragment.task_temp=Temporary task files
nativeTeam.prompts.hint.task_temp=Directs working and temporary files to {temp_dir}, the task's absolute scratch directory. Its contents are deleted when the task moves to Done.
nativeTeam.prompts.fragment.studio_skill=Studio skill
nativeTeam.prompts.hint.studio_skill=Points the session at the skill that teaches the Studio’s tools — the board, delegation, the shared documents, the code graph. Sent when the Studio’s own MCP server reaches the session; {skill} is the skill’s name. The skill itself ships with the Studio beside the tools it describes, so it is not a setting.
nativeTeam.prompts.fragment.no_studio_tools=No Studio tools
nativeTeam.prompts.hint.no_studio_tools=Sent instead of the Studio skill line when the member has routes but the Studio’s tools are disabled or unavailable.
nativeTeam.prompts.fragment.member_skills=Skills
nativeTeam.prompts.hint.member_skills=Sent when the member has been given skills on the Teams page — task runs and chats alike. {skills} is one line per skill: its name, its description and the path of its SKILL.md.
nativeTeam.prompts.fragment.docs_location=Documents folder
nativeTeam.prompts.hint.docs_location=Where the team’s shared documents live on disk.
nativeTeam.prompts.fragment.project_memory=Project memory
nativeTeam.prompts.hint.project_memory=Sent to task runs and chats while project memory is on and the Studio’s tools reach the session, also when it is empty — it asks agents to record what they learn. {entries} is the index: one line per entry, its name and description, cut at the limit set on the Memory page.
nativeTeam.prompts.fragment.subagents=Subagents
nativeTeam.prompts.hint.subagents=Sent to task runs the Studio’s tools reach; chats have no task to split and do not get it. Requires splitting the task into parallel parts and delegating them through the Studio’s subagent tools, and no subagents when the task does not split.
nativeTeam.prompts.fragment.code_graph=Code graph
nativeTeam.prompts.hint.code_graph=Sent when a graphify knowledge graph exists at the agent launch root — the Graphify plugin keeps one there. Names the graph and sends the session to the Studio skill for how to query it; {graph} is the file, {skill} the skill.
nativeTeam.prompts.fragment.isolated_checkout=Isolated checkout
nativeTeam.prompts.hint.isolated_checkout=Sent when the task runs in its own worktree, branched off the project (§10.5).
nativeTeam.prompts.fragment.outside_project=Outside the project
nativeTeam.prompts.hint.outside_project=Sent when the launch root places the session outside the project root.
nativeTeam.prompts.fragment.finish=Finishing up
nativeTeam.prompts.hint.finish=Closes the system prompt: asks for a summary for the reviewer.
nativeTeam.prompts.fragment.finish_tool=Finishing up, with the tools
nativeTeam.prompts.hint.finish_tool=Closes the system prompt when the Studio's tools reach the session: asks for finish_task with a result type — done, question or error — and the summary.
nativeTeam.prompts.fragment.resume=Resume
nativeTeam.prompts.hint.resume=Opens a resumed session when nothing new was written for it — the brief is already in its context.
nativeTeam.prompts.fragment.resume_notes=Notes preamble
nativeTeam.prompts.hint.resume_notes=Introduces the notes written since the last run stopped, right after the Resume message.
nativeTeam.prompts.fragment.review_changes=Changes requested
nativeTeam.prompts.hint.review_changes=Opens the session a reviewer sent back; {comment} is their feedback.
nativeTeam.prompts.fragment.stall_continue=Continue after a stall
nativeTeam.prompts.hint.stall_continue=Opens each automatic continuation of a session that stopped mid-work with its turn budget spent.
nativeTeam.prompts.fragment.mid_run_message=Message to a working session
nativeTeam.prompts.hint.mid_run_message=Wraps what you send to a task or a chat while its agent is working: handed over between two tool calls, or as the next turn. {message} is your text.
nativeTeam.prompts.fragment.result_required=Result missing
nativeTeam.prompts.hint.result_required=Sent once to a session that ended without calling finish_task; a session that still says nothing reaches review unlabelled.
nativeTeam.prompts.fragment.chat_mode=Chat mode
nativeTeam.prompts.hint.chat_mode=Stands where the task id would in a chat’s system prompt: this is a conversation with the user, not a card on the board.
nativeTeam.prompts.fragment.chat_context=Where the user is
nativeTeam.prompts.hint.chat_context=Opens every chat message; {context} is the page, the open document and the selected text at the moment of sending.
nativeTeam.prompts.fragment.producer_mode=Producer System Prompt
nativeTeam.prompts.hint.producer_mode=Defines the built-in Producer's responsibility and the rules for planning, approvals, scope review and waiting in Producer Mode. {language} is the initial conversation language.
nativeTeam.prompts.fragment.producer_start=Start Producer Mode
nativeTeam.prompts.hint.producer_start=Asks what the user wants to accomplish now.
nativeTeam.prompts.fragment.producer_wake=Resume Producer Mode
nativeTeam.prompts.hint.producer_wake=Resumes coordination after approval, task changes or a restart.
nativeTeam.prompts.fragment.task_compact=Compress task context
nativeTeam.prompts.hint.task_compact=Preserves decisions, completed work and pending requests in one summary for a fresh session.
nativeTeam.prompts.fragment.producer_compact=Compact Producer context
nativeTeam.prompts.hint.producer_compact=Summarizes goals, decisions and task progress for a fresh context.
nativeTeam.prompts.fragment.producer_careful=Producer: Careful
nativeTeam.prompts.hint.producer_careful=Forwards new execution questions and waits for your plan approval.
nativeTeam.prompts.fragment.producer_independent=Producer: Independent
nativeTeam.prompts.hint.producer_independent=Makes decisions and approves plans independently; escalates only critical blockers.
nativeTeam.prompts.fragment.producer_task_cost=Task cost checks
nativeTeam.prompts.hint.producer_task_cost=Tells the Producer how to compare accumulated API Cost with Estimate Task Cost before continuing a task and when to split remaining work into new tasks.
nativeTeam.prompts.fragment.producer_review=Task review rules
nativeTeam.prompts.hint.producer_review=Guides review decisions and explains how to close completed work and create follow-up tasks for corrections.
nativeTeam.prompts.fragment.producer_state=Current state and task history
nativeTeam.prompts.hint.producer_state=Adds the current Producer state and guidance for reading task history. {state} is the saved state and task board; {prompt} is the current request.
nativeTeam.prompts.fragment.producer_summary=Saved conversation summary
nativeTeam.prompts.hint.producer_summary=Restores the saved summary before a new request. {summary} is the compacted conversation; {prompt} is the current request.
